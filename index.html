<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI T-Shirt Designer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z" />
            </svg>
            BlackFeel Platform
        </div>
        <div>
            <button class="btn btn-outline" style="border:none;">Sign In</button>
        </div>
    </header>

    <main>
        <!-- Sidebar Controls -->
        <aside class="controls-panel">

            <!-- Mode Tabs -->
            <div class="tabs-list">
                <button class="tab-trigger active" onclick="switchTab('ai')">AI Generate</button>
                <button class="tab-trigger" onclick="switchTab('upload')">Upload Image</button>
            </div>

            <!-- AI MODE CONTENT -->
            <div id="tab-ai" class="tab-content active">
                <div class="input-group">
                    <label for="prompt">Design Prompt</label>
                    <textarea id="prompt"
                        placeholder="E.g., A futuristic cyberpunk dragon in neon colors, vector style..."></textarea>
                </div>

                <div class="input-group">
                    <label>Style Preset</label>
                    <select id="style-select">
                        <option value="realistic">Realistic</option>
                        <option value="vector">Vector / Flat</option>
                        <option value="anime">Anime / Illustration</option>
                        <option value="vintage">Vintage Retro</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="generateDesign()">
                    <span id="gen-btn-text">Generate Design</span>
                </button>
            </div>

            <!-- UPLOAD MODE CONTENT -->
            <div id="tab-upload" class="tab-content">
                <div class="file-drop-area" id="drop-area">
                    <span class="file-msg">Drag & drop or click to upload design</span>
                    <input class="file-input" type="file" accept="image/*" id="file-input">
                </div>
                
                <!-- Editor Controls (hidden until image is uploaded) -->
                <div id="editor-controls" style="display: none; margin-top: 1.5rem;">
                    <div class="section-title">Design Controls</div>
                    
                    <div class="input-group">
                        <label>Scale <span class="value-display"><span id="scaleValue">40</span>%</span></label>
                        <input type="range" id="scale" min="10" max="80" value="40" style="width: 100%;">
                    </div>

                    <div class="input-group">
                        <label>Position</label>
                        <div class="position-grid">
                            <button class="position-btn" data-position="top_left">↖</button>
                            <button class="position-btn" data-position="top">↑</button>
                            <button class="position-btn" data-position="top_right">↗</button>
                            <button class="position-btn" data-position="left">←</button>
                            <button class="position-btn active" data-position="center">●</button>
                            <button class="position-btn" data-position="right">→</button>
                            <button class="position-btn" data-position="bottom_left">↙</button>
                            <button class="position-btn" data-position="bottom">↓</button>
                            <button class="position-btn" data-position="bottom_right">↘</button>
                        </div>
                    </div>

                    <div class="editor-actions" style="display: flex; gap: 0.75rem; margin-top: 1rem;">
                        <button class="btn btn-outline" id="reset-position" style="flex: 1;">Reset</button>
                        <button class="btn btn-outline" id="download-preview" style="flex: 1;">Preview</button>
                        <button class="btn btn-primary" id="bake-design" style="flex: 1;">Bake</button>
                    </div>
                </div>

                <div class="info-text" style="margin-top: 1rem; font-size: 0.75rem; color: var(--muted-foreground);">
                    <strong>Tip:</strong> Drag the design on the t-shirt to reposition it
                </div>
            </div>

            <!-- Settings Common -->
            <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                <div class="section-title">Product Details</div>
                <div class="input-group">
                    <label>Color</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <div class="color-swatch"
                            style="width:30px; height:30px; border-radius:50%; background:#ffffff; border:1px solid #333; cursor:pointer;"
                            onclick="changeShirtColor('#ffffff')"></div>
                        <div class="color-swatch"
                            style="width:30px; height:30px; border-radius:50%; background:#18181b; border:1px solid #333; cursor:pointer;"
                            onclick="changeShirtColor('#18181b')"></div>
                        <div class="color-swatch"
                            style="width:30px; height:30px; border-radius:50%; background:#7f1d1d; border:1px solid #333; cursor:pointer;"
                            onclick="changeShirtColor('#7f1d1d')"></div>
                        <div class="color-swatch"
                            style="width:30px; height:30px; border-radius:50%; background:#2563eb; border:1px solid #333; cursor:pointer;"
                            onclick="changeShirtColor('#2563eb')"></div>
                    </div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button class="btn btn-outline" style="flex:1">Add to Cart</button>
                    <button class="btn btn-primary" style="flex:1">Buy Now!</button>
                </div>
            </div>
        </aside>

        <!-- Preview Area -->
<!-- Preview Area -->
<section class="preview-panel">

    <div class="tshirt-container" id="tshirt-container">
        <!-- Canvas for Editor (hidden in AI mode) -->
        <canvas id="editor-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: none;"></canvas>
        
        <!-- Original T-Shirt View (for AI mode) -->
        <div id="ai-view" style="position: relative; width: 100%; height: 100%;">
            <img src="images/tshirt-white.png" alt="T-Shirt Base" class="tshirt-base" id="tshirt-background">

            <!-- DESIGN LAYER (Masked by SVG path) -->
            <img src="" alt="Design" class="design-layer" id="design-image"
                style="clip-path: url(#shirt-clip); opacity: 0;">

            <!-- SVG Definitions for Masking and Shape -->
            <svg class="tshirt-svg" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- The shape of the t-shirt -->
                    <clipPath id="shirt-clip">
                        <path
                            d="M375,60 L375,150 L460,150 L460,250 L390,250 L390,550 L110,550 L110,250 L40,250 L40,150 L125,150 L125,60 C125,60 160,110 250,110 C340,110 375,60 375,60 Z" />
                    </clipPath>

                    <!-- Gradient for base shirt color overlay -->
                    <linearGradient id="shirt-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:rgb(0,0,0);stop-opacity:0.1" />
                        <stop offset="50%" style="stop-color:rgb(255,255,255);stop-opacity:0.05" />
                        <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0.1" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Loading State -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text" style="margin-top: 1rem; color: var(--foreground);">Processing...</div>
        </div>
    </div>

</section>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="script.js"></script>
</body>

</html>
